</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">◷</span><div>Life Time<small>CHOOSE WITH INTENTION</small></div></div><nav id="nav" class="sidenav"></nav><div class="sidequote">選ぶ → 動く → 振り返る<br>自分の時間を、自分の意思で。</div></aside><main class="main" id="main" aria-live="polite"></main></div><nav class="appnav" id="appnav"></nav><div class="toast" id="toast" role="status"></div><script>const APP_VERSION='1.0.0';
const LANES={protect:{label:'守る',detail:'責任・約束・生活の土台'},advance:{label:'進める',detail:'将来につながる前進'},fulfill:{label:'満たす',detail:'幸福・つながり・回復'}};
const MODES={reset:'RESET',action:'ACTION',recovery:'RECOVERY'};
const ACTION_TYPES={create:'Create',maintain:'Maintain',think:'Think',decide:'Decide',produce:'Produce',recover:'Recover'};
const TYPE_MODES={create:'action',maintain:'action',think:'reset',decide:'reset',produce:'action',recover:'recovery'};
function localDate(dt=new Date()){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function clamp(num,min,max){const n=Number(num);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):min;}
function positive(num,fallback=0){const n=Number(num);return Number.isFinite(n)?Math.max(0,n):fallback;}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function diffDays(d1,d2){if(!/^\d{4}-\d{2}-\d{2}$/.test(d1||'')||!/^\d{4}-\d{2}-\d{2}$/.test(d2||''))return null;return Math.round((Date.parse(d1+'T12:00:00Z')-Date.parse(d2+'T12:00:00Z'))/86400000);}
function weekKey(day){const d=new Date(`${day}T12:00:00Z`); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow);return d.toISOString().slice(0,10);}
function isDone(task,day){if(task.recurrence==='daily')return (task.doneDays||[]).includes(day);if(task.recurrence==='weekly')return (task.doneWeeks||[]).includes(weekKey(day));return task.status==='done';}
function isDueForDisplay(task,day){if(task.recurrence==='weekly')return new Date(`${task.createdAt.slice(0,10)}T12:00:00Z`).getUTCDay()===new Date(`${day}T12:00:00Z`).getUTCDay();return true;}
function activeTasks(tasks,day){return (tasks||[]).filter(t=>t.status!=='archived'&&t.status!=='done'&&!isDone(t,day) && isDueForDisplay(t,day));}
function newTask(raw={},now=new Date()){
 const date=localDate(now);
 const lane=['protect','advance','fulfill'].includes(raw.lane)?raw.lane:'advance';
 const actionType=Object.hasOwn(ACTION_TYPES,raw.actionType)?raw.actionType:(lane==='fulfill'?'recover':'produce');
 return {id:raw.id||`t_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,title:String(raw.title||'').trim().slice(0,140),lane,actionType,
 firstStep:String(raw.firstStep||'').trim().slice(0,220),minutes:Math.round(clamp(raw.minutes??25,5,600)),importance:Math.round(clamp(raw.importance??2,1,3)),
 resistance:Math.round(clamp(raw.resistance??2,1,3)),volume:Math.round(clamp(raw.volume??2,1,3)),complexity:Math.round(clamp(raw.complexity??2,1,3)),
 due:/^\d{4}-\d{2}-\d{2}$/.test(raw.due||'')?raw.due:'',fixed:!!raw.fixed,recurrence:['none','daily','weekly'].includes(raw.recurrence)?raw.recurrence:'none',
 status:['active','done','archived'].includes(raw.status)?raw.status:'active',createdAt:raw.createdAt||now.toISOString(),updatedAt:now.toISOString(),
 doneDays:Array.isArray(raw.doneDays)?raw.doneDays:[],doneWeeks:Array.isArray(raw.doneWeeks)?raw.doneWeeks:[],notes:String(raw.notes||'').slice(0,1200)};
}
function loadScore(task,energy='medium'){const load=task.resistance+task.volume+task.complexity;return {raw:load,label:load<=4?'軽い':load<=6?'普通':'重い',fits:energy==='high'||(energy==='medium'&&load<=7)||(energy==='low'&&load<=5)};}
function priority(task,{day=localDate(),minutes=30,energy='medium',focus='balanced',fulfilledLanes=[]}={}){
 const left=diffDays(task.due,day);const importance=Math.round(clamp(task.importance,1,3));const load=loadScore(task,energy);
 const dueScore=left===null?0:left<0?65:left===0?62:left===1?40:left<=3?24:left<=7?10:0;
 const important=importance===3?31:importance===2?18:8;
 const laneBonus=(focus!=='balanced'&&task.lane===focus)?13:0;
 const missing=(!fulfilledLanes.includes(task.lane)&&task.lane!=='protect')?7:0;
 const fixedBonus=task.fixed?17:0;
 const penalty=!load.fits? (dueScore>=40?8:21):0;
 const timePenalty=task.minutes>minutes?(dueScore>=40?6:16):0;
 const score=dueScore+important+laneBonus+missing+fixedBonus-penalty-timePenalty;
 const reasons=[];
 if(left!==null&&left<0)reasons.push('期限を過ぎている');else if(left===0)reasons.push('今日が期限');else if(left===1)reasons.push('明日が期限');else if(left!==null&&left<=3)reasons.push('期限が近い');
 if(task.fixed)reasons.push('守りたい約束');
 if(importance===3)reasons.push('重要度が高い');
 if(laneBonus)reasons.push('今の方針に合う');
 if(missing)reasons.push(`今日は「${LANES[task.lane].label}」がまだ`);
 if(!load.fits)reasons.push('今の余力には少し重い');
 if(task.minutes>minutes)reasons.push('全部は難しいため最初の一歩から');
 if(reasons.length===0)reasons.push(`${LANES[task.lane].label}につながる行動`);
 return {score,load,daysUntilDue:left,reasons,needsSmallStep:task.minutes>minutes||!load.fits};
}
function suggestions(tasks,context,logs=[]){
 const doneLanes=Array.from(new Set(logs.filter(x=>x.date===context.day&&x.completed).map(x=>x.lane)));
 const ranked=activeTasks(tasks,context.day).map(t=>({task:t,score:priority(t,{...context,fulfilledLanes:doneLanes})}));
 ranked.sort((a,b)=>b.score.score-a.score.score||a.task.minutes-b.task.minutes||a.task.createdAt.localeCompare(b.task.createdAt));
 return ranked;
}
function markDone(task,day){
 const next={...task,updatedAt:new Date().toISOString()};
 if(task.recurrence==='daily')next.doneDays=Array.from(new Set([...(task.doneDays||[]),day]));
 else if(task.recurrence==='weekly')next.doneWeeks=Array.from(new Set([...(task.doneWeeks||[]),weekKey(day)]));
 else next.status='done';
 return next;
}
function undoDone(task,day){
 const next={...task,updatedAt:new Date().toISOString()};
 if(task.recurrence==='daily')next.doneDays=(task.doneDays||[]).filter(x=>x!==day);
 else if(task.recurrence==='weekly')next.doneWeeks=(task.doneWeeks||[]).filter(x=>x!==weekKey(day));
 else if(task.status==='done')next.status='active';
 return next;
}
function dayStats(tasks,logs,date=localDate()){
 const done=(logs||[]).filter(l=>l.date===date&&l.completed);
 const unique=new Set(done.map(x=>x.taskId));
 return {protect:new Set(done.filter(l=>l.lane==='protect').map(x=>x.taskId)).size,advance:new Set(done.filter(l=>l.lane==='advance').map(x=>x.taskId)).size,fulfill:new Set(done.filter(l=>l.lane==='fulfill').map(x=>x.taskId)).size,minutes:done.reduce((n,l)=>n+positive(l.minutes),0),count:unique.size};
}
function validateBackup(data){
 if(!data||data.app!=='Life Time'||!Array.isArray(data.tasks)||!Array.isArray(data.sessions)||!Array.isArray(data.reviews)||!data.settings||data.tasks.length>5000||data.sessions.length>50000||data.reviews.length>15000)throw Error('Life Timeのバックアップではないか、件数が多すぎます。');
 const ids=new Set();
 for(const t of data.tasks){if(!t||typeof t.id!=='string'||ids.has(t.id)||typeof t.title!=='string'||!Object.hasOwn(LANES,t.lane)||t.title.length>140||!Number.isFinite(t.minutes)||t.minutes<0)throw Error('行動データが不正です。');ids.add(t.id);}
 for(const s of data.sessions){if(!s||typeof s.id!=='string'||typeof s.date!=='string'||s.date.length!==10||!Number.isFinite(s.minutes)||s.minutes<0||s.minutes>1440)throw Error('実行記録の形式が不正です。');}
 for(const r of data.reviews){if(!r||typeof r.date!=='string'||r.date.length!==10||![1,2,3].includes(r.fulfillment)||![1,2,3].includes(r.agency))throw Error('振り返り記録の形式が不正です。');}
 return true;
}

const $=selector=>document.querySelector(selector);
const h=escapeHtml;
const TODAY=()=>localDate();
const defaultData=()=>({app:'Life Time',version:APP_VERSION,tasks:[],sessions:[],reviews:[],settings:{},activeSession:null});
let data=defaultData();
const ui={view:'home',selectedTask:null,editing:false,filter:'active',formLane:'advance',altIndex:0,day:TODAY(),context:{energy:'medium',minutes:30,focus:'balanced'},storage:'indexeddb'};
let toastTimer;
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function storage(mode,value){return new Promise((resolve,reject)=>{const req=indexedDB.open('life-time-1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;const tx=db.transaction('state',mode==='read'?'readonly':'readwrite');const op=mode==='read'?tx.objectStore('state').get('data'):tx.objectStore('state').put(value,'data');let result;op.onsuccess=()=>result=op.result;op.onerror=()=>reject(op.error);tx.oncomplete=()=>{db.close();resolve(result)};tx.onerror=()=>{db.close();reject(tx.error)}}})}
async function load(){try{const got=await storage('read');if(got&&got.app==='Life Time'){data=got}}catch(e){ui.storage='local';try{const got=JSON.parse(localStorage.getItem('life-time-data')||'null');if(got&&got.app==='Life Time')data=got}catch{ui.storage='temporary'}}ui.context=data.settings?.contexts?.[ui.day]||ui.context;render()}
async function save(){try{if(ui.storage==='indexeddb')await storage('write',data);else if(ui.storage==='local')localStorage.setItem('life-time-data',JSON.stringify(data));else notify('端末保存が使えません。バックアップを取ってください。')}catch{notify('保存に失敗しました。設定からバックアップを取ってください。')}}
function nav(view){ui.view=view;ui.altIndex=0;render();scrollTo(0,0)}
function hdr(pre,title,subtitle){return `<header class="head"><div class="eyebrow">${pre}</div><h1>${title}</h1>${subtitle?`<div class="sub">${subtitle}</div>`:''}</header>`}
const navItems={home:['⌂','今日'],tasks:['☰','行動'],insights:['▥','記録'],settings:['⚙','設定']};
function navigation(){return Object.entries(navItems).map(([key,[symbol,label]])=>`<button class="${ui.view===key||(['form','session','review'].includes(ui.view)&&key==='home')?'active':''}" data-nav="${key}"><span>${symbol}</span>${label}</button>`).join('')}
function laneBadge(lane){return `<span class="lanelabel ${lane}">${LANES[lane]?.label||'その他'}</span>`}
function uiDate(date){if(!date)return '期限なし';const d=diffDays(date,ui.day);return d<0?`<span class="overdue">${Math.abs(d)}日超過</span>`:d===0?'<span class="overdue">今日が期限</span>':d===1?'明日が期限':`${date.slice(5).replace('-','/')}まで`}
function taskState(t){return isDone(t,ui.day)||t.status==='done'}
function doneLog(t,minutes,estimated=false){return {id:`s_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,taskId:t?.id||null,title:t?.title||'休息',lane:t?.lane||'fulfill',date:ui.day,minutes:Math.round(clamp(minutes,0,1440)),completed:!!t,estimated,createdAt:new Date().toISOString()}}
function taskRow(t){const done=taskState(t);const load=loadScore(t,ui.context.energy);return `<div class="taskrow ${done?'done':''}"><div style="min-width:0">${laneBadge(t.lane)} <span class="pill">${t.minutes}分</span> <div class="tasktitle" style="margin-top:7px">${h(t.title)}</div><div class="meta">${uiDate(t.due)} · 負荷${load.raw}/9 · ${t.recurrence==='daily'?'毎日':t.recurrence==='weekly'?'毎週':'1回'}</div></div><div class="right"><button class="btn small" data-edit="${h(t.id)}">編集</button>${done?`<button class="btn small" data-undo="${h(t.id)}">戻す</button>`:`<button class="btn small soft" data-complete="${h(t.id)}">完了</button>`}</div></div>`}
function last7Stats(){const now=new Date();let reviews=[],count=0,mins=0;for(let i=0;i<7;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const day=localDate(d);const rev=data.reviews.find(x=>x.date===day);if(rev)reviews.push(rev);const sessions=data.sessions.filter(x=>x.date===day&&x.completed);count+=sessions.length;mins+=sessions.reduce((n,s)=>n+positive(s.minutes),0)}return {reviews,count,mins};}

function suggestionCard({task:t,score:s}){const short=s.needsSmallStep;const action=t.firstStep|| (short?'5分だけ手をつけ、次の一手を決める':'まず必要なものを開いて、最初の手順に着手する');const all=suggestions(data.tasks,{day:ui.day,...ui.context},data.sessions);return `<section class="primaryPanel"><div class="paneltop">${laneBadge(t.lane)}<span class="badge ${s.daysUntilDue!==null&&s.daysUntilDue<=0?'warn':''}">${uiDate(t.due)}</span></div>

function render(){if(ui.day!==TODAY()){ui.day=TODAY();ui.context=data.settings?.contexts?.[ui.day]||{energy:'medium',minutes:30,focus:'balanced'}}const navHTML=navigation();$('#nav').innerHTML=navHTML;$('#appnav').innerHTML=navHTML;const views={home, tasks:taskList,form:formView,session:sessionView,review:reviewView,insights:insightView,settings:settingsView};$('#main').innerHTML=(views[ui.view]||home)();updateClock()}
function newTaskView(task=null){ui.editing=!!task;ui.editDraft=task?structuredClone(task):newTask({lane:'advance',title:'',minutes:25});nav('form')}
async function completeTask(id){const idx=data.tasks.findIndex(t=>t.id===id);if(idx<0)return;const t=data.tasks[idx];if(isDone(t,ui.day)){notify('すでに完了しています');return}data.tasks[idx]=markDone(t,ui.day);data.sessions.push(doneLog(t,t.minutes,true));await save();render();notify('記録しました。おつかれさまでした。')}
async function undoTask(id){const idx=data.tasks.findIndex(t=>t.id===id);if(idx<0)return;data.tasks[idx]=undoDone(data.tasks[idx],ui.day);const logIdx=data.sessions.findLastIndex(x=>x.taskId===id&&x.date===ui.day&&x.completed);if(logIdx>=0)data.sessions.splice(logIdx,1);await save();render();notify('完了を取り消しました')}
const presets=[{title:'明日の準備を整える',lane:'protect',minutes:10,firstStep:'明日必要なものを1つ確認する',actionType:'maintain'}, {title:'英語を10分練習する',lane:'advance',minutes:10,firstStep:'使いたい表現を1つ声に出す',actionType:'produce'},{title:'家族とゆっくり会話する',lane:'fulfill',minutes:15,firstStep:'スマホを置いて話し始める',actionType:'recover'},{title:'心身を整える時間を取る',lane:'fulfill',minutes:15,firstStep:'落ち着ける場所で休む',actionType:'recover'}];
async function startSession(taskId=null){if(data.activeSession){nav('session');return}const task=data.tasks.find(t=>t.id===taskId);const planned=task?Math.max(5,Math.min(task.minutes,Number(ui.context.minutes)||30)):15;const rec=task?priority(task,{day:ui.day,...ui.context}):null;data.activeSession={taskId:task?.id||null,plannedMinutes:rec?.needsSmallStep?5:planned,startedAt:new Date().toISOString()};await save();nav('session')}
async function finishSession(){const ses=data.activeSession;if(!ses)return;const elapsed=Math.max(1,Math.round((Date.now()-new Date(ses.startedAt).getTime())/60000));const t=data.tasks.find(x=>x.id===ses.taskId);const complete=t?confirm('この行動を「完了」にしますか？\n\n「キャンセル」で、今回の作業時間だけを記録します。'):false;data.sessions.push({...doneLog(t,elapsed,false),completed:t?!!complete:true});if(t&&complete){const idx=data.tasks.findIndex(x=>x.id===t.id);data.tasks[idx]=markDone(t,ui.day)}data.activeSession=null;await save();nav('home');notify(complete?'完了を記録しました':'時間を記録しました')}
async function cancelSession(){if(!confirm('現在のセッションを中断しますか？中断した時間は記録されません。'))return;data.activeSession=null;await save();nav('home')}
async function handleClick(e){const b=e.target.closest('[data-nav],[data-ctx],[data-action],[data-filter],[data-edit],[data-complete],[data-undo],[data-delete],[data-preset]');if(!b)return;
 if(b.dataset.nav){nav(b.dataset.nav);return}
 if(b.dataset.ctx){ui.context[b.dataset.ctx]=b.dataset.val;data.settings.contexts??={};data.settings.contexts[ui.day]=ui.context;await save();ui.altIndex=0;render();return}
 if(b.dataset.filter){ui.filter=b.dataset.filter;render();return}
 if(b.dataset.edit){const t=data.tasks.find(t=>t.id===b.dataset.edit);if(t)newTaskView(t);return}
 if(b.dataset.complete){await completeTask(b.dataset.complete);return}
 if(b.dataset.undo){await undoTask(b.dataset.undo);return}
 if(b.dataset.delete){if(!confirm('この行動を削除しますか？過去の実行記録は残ります。'))return;data.tasks=data.tasks.filter(t=>t.id!==b.dataset.delete);await save();nav('tasks');notify('行動を削除しました');return}
 if(b.dataset.preset){const item=presets[Number(b.dataset.preset)];if(item){data.tasks.push(newTask(item));await save();render();notify('登録しました')}return}
 if(b.dataset.action){switch(b.dataset.action){case 'task-new':newTaskView();break;case 'resume':nav('session');break;case 'next':ui.altIndex++;render();break;case 'start':await startSession(b.dataset.id);break;case 'recovery':await startSession(null);break;case 'finish-session':await finishSession();break;case 'cancel-session':await cancelSession();break;case 'explain':alert('「今のおすすめ」は、期限・約束・重要度を優先し、今のエネルギーと空き時間も考慮しています。\n\n難しいが重要な行動は、まず5分の着手を提案します。\n\nこの順位は絶対ではありません。ほかの候補から選ぶこともできます。');break;case 'export':exportBackup();break;case 'import':$('#import-file')?.click();break;case 'delete-all':if(confirm('すべての時間記録・行動・振り返りを削除しますか？元に戻せません。')){data=defaultData();await save();nav('home');notify('すべて削除しました')}break}}
}
function submitTask(e){e.preventDefault();const fd=new FormData(e.target);const raw=Object.fromEntries(fd.entries());raw.fixed=!!fd.get('fixed');raw.minutes=Number(raw.minutes);raw.importance=Number(raw.importance);raw.resistance=Number(raw.resistance);raw.volume=Number(raw.volume);raw.complexity=Number(raw.complexity);
 if(!raw.title?.trim()){notify('行動の名前を入力してください');return}if(!Number.isFinite(raw.minutes)||raw.minutes<5){notify('5分以上の時間を入力してください');return}
 const task=newTask({...ui.editDraft,...raw});if(ui.editing){const idx=data.tasks.findIndex(t=>t.id===task.id);if(idx>=0)data.tasks[idx]=task}else data.tasks.push(task);
 save().then(()=>{nav('tasks');notify('行動を保存しました')});}
function submitReview(e){e.preventDefault();const fd=new FormData(e.target);const r={date:ui.day,fulfillment:Number(fd.get('fulfillment')),agency:Number(fd.get('agency')),goodThing:String(fd.get('goodThing')||'').slice(0,250)};if(![1,2,3].includes(r.fulfillment)||![1,2,3].includes(r.agency)){notify('2つの質問に答えてください');return}data.reviews=data.reviews.filter(x=>x.date!==ui.day);data.reviews.push(r);save().then(()=>{nav('home');notify('今日の振り返りを保存しました')})}
function exportBackup(){const blob=new Blob([JSON.stringify({...data,version:APP_VERSION,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`LifeTime_backup_${ui.day}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('バックアップファイルを保存しました')}
async function importBackup(file){try{if(file.size>15*1024*1024)throw Error('ファイルサイズが大きすぎます。');const parsed=JSON.parse(await file.text());validateBackup(parsed);if(!confirm('現在の記録を置き換えてバックアップを読み込みます。よろしいですか？'))return;data=parsed;ui.context=data.settings?.contexts?.[ui.day]||{energy:'medium',minutes:30,focus:'balanced'};await save();nav('home');notify('読み込みが完了しました')}catch(err){alert('読み込めませんでした：'+err.message)}}
function updateClock(){const timer=$('[data-timer]');const s=data.activeSession;if(!timer||!s)return;const rem=Math.max(0,s.plannedMinutes*60-Math.floor((Date.now()-new Date(s.startedAt).getTime())/1000));timer.textContent=`${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`}
document.addEventListener('click',e=>{handleClick(e).catch(err=>{console.error(err);notify('操作に失敗しました。もう一度お試しください。')})});
document.addEventListener('submit',e=>{if(e.target.id==='taskForm')submitTask(e);if(e.target.id==='reviewForm')submitReview(e)});
document.addEventListener('change',e=>{if(e.target.id==='import-file'&&e.target.files?.[0])importBackup(e.target.files[0]);});
setInterval(()=>{if(ui.day!==TODAY())render();else updateClock()},1000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
load();
</script></body></html>
